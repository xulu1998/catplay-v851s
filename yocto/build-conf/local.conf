require conf/local/include/c2a/common.conf
require conf/local/include/c2a/git-config.conf
require conf/local/include/c2a/reproducible-build.conf

MACHINE = "v851s-rtl8733bs"

# VM: 8 cores, 16 GiB RAM + 8 GiB swap. The first run with 8 GiB and -j 6 was OOM-killed in
# llvm-native (one cc1plus ~2.5 GiB). Keep the LLVM/Rust toolchain recipes at -j 4.
BB_NUMBER_THREADS = "6"
PARALLEL_MAKE = "-j 8"
PARALLEL_MAKE:pn-llvm-native = "-j 4"
PARALLEL_MAKE:pn-clang-native = "-j 4"
PARALLEL_MAKE:pn-clang-cross-arm = "-j 4"
PARALLEL_MAKE:pn-clang = "-j 4"
PARALLEL_MAKE:pn-compiler-rt = "-j 4"
PARALLEL_MAKE:pn-libcxx = "-j 4"
PARALLEL_MAKE:pn-rust-native = "-j 4"
PARALLEL_MAKE:pn-rust-llvm-native = "-j 4"

DL_DIR = "${HOME}/yocto/downloads"
SSTATE_DIR = "${HOME}/yocto/sstate-cache"

# Upstream c2a clang.conf limits LLVM to ARM;X86;Mips;RISCV (they build on x86). On the aarch64
# VM, rust-native needs a host (AArch64) backend in llvm-native, else rustc fails with
# "No available targets are compatible with triple aarch64-unknown-linux-gnu".
LLVM_TARGETS_TO_BUILD:append:pn-llvm-native = ";AArch64"
