POKY_BBLAYERS_CONF_VERSION = "2"
BBPATH = "${TOPDIR}"
BBFILES ?= ""
Y = "${HOME}/yocto/catplay-firmware"
# This repository (scripts/yocto-setup.sh writes the real path). Also used by u5a-bench for build/modules
# and blobs/.
U5A_REPO = "@U5A_REPO@"
BBLAYERS ?= " \
  ${Y}/openembedded-core/meta \
  ${Y}/meta-openembedded/meta-oe \
  ${Y}/meta-openembedded/meta-python \
  ${Y}/meta-openembedded/meta-networking \
  ${Y}/meta-openembedded/meta-multimedia \
  ${Y}/meta-openembedded/meta-filesystems \
  ${Y}/meta-openembedded/meta-initramfs \
  ${Y}/meta-clang \
  ${Y}/meta-freescale \
  ${Y}/meta-carplay \
  ${Y}/meta-catplay \
  ${Y}/meta-carlinkit \
  ${Y}/meta-sunxi \
  ${U5A_REPO}/yocto/meta-u5a \
"
