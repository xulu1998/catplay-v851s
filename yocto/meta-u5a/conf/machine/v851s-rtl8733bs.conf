#@NAME: LY2734 smartBox / U5A (Allwinner V851S, Cortex-A7, RTL8733BS)
# P3: userspace only. The kernel (mainline 7.2.7), DT and g_iphone.ko are built
# outside Yocto (scripts/stage1-mainline-7.2.7-*.sh) and boot over FEL from RAM.

MACHINEOVERRIDES =. "u5a:v851s:"

DEFAULTTUNE = "cortexa7thf-neon-vfpv4"
require conf/machine/include/arm/armv7a/tune-cortexa7.inc

DISTRO = "c2a-musl"
MACHINE_FEATURES += "wifi bluetooth"
CATPLAY_DEBUG_BUILD ?= "0"

PREFERRED_PROVIDER_virtual/kernel = "linux-dummy"
KERNEL_IMAGETYPE = "zImage"

# Board facts (E25, E26): MFi CP 2.0C on i2c bus 3 at 0x11; musb UDC 4100000.usb.
U5A_MFI_I2C_BUS = "3"
U5A_MFI_I2C_ADDR = "0x11"
U5A_UDC = "4100000.usb"

# Image content (u5a-e28-image): upstream C2A system packages minus wpa-supplicant (AP only, as V821).
C2A_SYSTEM_PACKAGES:remove = "wpa-supplicant"
MACHINE_FIRMWARE:append = " catplay u5a-bench"

# E33 usb0 capture: tcpdump without OpenSSL (ESP decryption is not needed; libcrypto3 alone is 2+ MiB)
PACKAGECONFIG:remove:pn-tcpdump = "openssl"
