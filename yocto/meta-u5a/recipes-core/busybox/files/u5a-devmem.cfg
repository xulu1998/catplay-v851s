CONFIG_DEVMEM=y
# Settings web page (busybox httpd with shell CGIs) and firmware update over Wi-Fi
CONFIG_HTTPD=y
CONFIG_FEATURE_HTTPD_CGI=y
CONFIG_FEATURE_HTTPD_ENCODE_URL_STR=y
CONFIG_FEATURE_HTTPD_RANGES=n
CONFIG_TIMEOUT=y
CONFIG_BASE64=y
CONFIG_FLASHCP=y
CONFIG_FLASH_ERASEALL=y
# head -c / tail -c are used by the save and update CGIs and the log snapshots
CONFIG_FEATURE_FANCY_HEAD=y
CONFIG_FEATURE_FANCY_TAIL=y
# busybox 1.37 bug: with CGI but without BASIC_AUTH, "/" never gets index.html restored -> 404.
# No httpd.conf is installed, so no password is ever asked.
CONFIG_FEATURE_HTTPD_BASIC_AUTH=y
